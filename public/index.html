<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Trace Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">C</span><strong>Trace</strong></div>
      <nav id="breadcrumb" class="breadcrumb"><button data-route="days">Days</button><span>/</span><button id="breadcrumb-day" class="hidden"></button><span id="breadcrumb-session-separator" class="hidden">/</span><strong id="active-session-name" class="hidden"></strong></nav>
      <nav class="mode-switch">
        <button class="mode active" data-mode="traces">Traces</button>
        <button class="mode" data-mode="reviews">Daily Reviews</button>
      </nav>
      <div class="toolbar"><label class="sr-only"><input id="auto-refresh" type="checkbox" checked /> Auto refresh</label><button id="settings-button" title="Settings">⚙</button><button id="refresh" title="Refresh">↻</button></div>
    </header>
    <main id="day-browser" class="browser-page">
      <div class="browser-header"><div><span class="eyebrow">OBSERVABILITY</span><h1>Codex activity</h1><p>Browse local traces by day.</p></div><div class="browser-total"><strong id="day-count">0</strong><span>active days</span></div></div>
      <div id="days-list" class="days-list"></div>
    </main>
    <main id="session-browser" class="browser-page hidden">
      <div class="browser-header"><div><button id="back-to-days" class="back-button">← Days</button><h1 id="sessions-day-title">Sessions</h1><p>Select a session to inspect its trace.</p></div><div class="browser-total"><strong id="session-count">0</strong><span>sessions</span></div></div>
      <div class="session-search standalone"><span>⌕</span><input id="session-search" type="search" placeholder="Search sessions" /></div>
      <div id="sessions-list" class="session-table"></div>
    </main>
    <main id="trace-workspace" class="workspace hidden">
      <section class="timeline pane trace-navigation">
        <div class="trace-tools"><div class="tree-search"><span>⌕</span><input id="tree-search" type="search" placeholder="Search observations" /></div><button id="expand-all" title="Expand all">↕</button></div>
        <div class="tabs" role="tablist">
          <button class="tab active" data-view="tree">Tree</button>
          <button class="tab" data-view="timeline">Timeline</button>
        </div>
        <div id="timeline-list" class="timeline-list"></div>
        <section class="trace-graph"><div class="graph-title">Graph <button id="graph-fit" title="Fit graph">⌗</button></div><div id="graph-canvas" class="graph-canvas empty">Select a session</div></section>
      </section>
      <aside class="details pane">
        <div id="trace-summary" class="trace-summary empty">Select a session</div>
        <div id="details" class="details-content empty">选择一条记录查看详情</div>
      </aside>
    </main>
    <main id="reviews-workspace" class="reviews-workspace hidden">
      <aside class="review-days pane">
        <div class="pane-title">Daily Reviews <span id="review-count">0</span></div>
        <div id="review-list" class="sessions-list"></div>
      </aside>
      <section class="review-dashboard pane">
        <div id="review-header" class="review-header empty">运行今日复盘后查看使用习惯</div>
        <div id="review-content" class="review-content"></div>
      </section>
    </main>
    <dialog id="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="dialog-title"><strong>Daily Review Settings</strong><button value="cancel" title="关闭">×</button></div>
        <label class="field"><span>启用每日复盘</span><input name="enabled" type="checkbox" /></label>
        <label class="field"><span>每日运行时间</span><input name="scheduleTime" type="time" required /></label>
        <label class="field"><span>Skill 未使用阈值（天）</span><input name="inactiveSkillDays" type="number" min="1" max="3650" /></label>
        <label class="field"><span>MCP 未使用阈值（天）</span><input name="inactiveMcpDays" type="number" min="1" max="3650" /></label>
        <label class="field"><span>日报保留天数</span><input name="retentionDays" type="number" min="1" max="3650" /></label>
        <div class="repository-path">日报仓库：<code id="data-root"></code></div>
        <div id="settings-error" class="form-error"></div>
        <div class="dialog-actions">
          <button id="run-review" type="button">立即复盘今天</button>
          <button class="primary" value="save">保存设置</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
